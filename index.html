<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Block Tsunami Survival 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--gold:#ffc93c;--panel:rgba(255,248,225,.92);--red:#e5484d;--blue:#2563eb;--green:#2f9e44}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--ink);user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#panel{position:absolute;top:14px;left:14px;background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:10px 14px;min-width:270px;font-weight:800;font-size:14px;line-height:1.7;box-shadow:0 4px 0 var(--ink)}
#panel .big{font-size:26px;line-height:1.3}
#panel button{margin-top:8px;width:100%;pointer-events:auto}
#escape{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(460px,40vw);display:none;text-align:center;font-weight:800;color:#fff;text-shadow:0 2px 0 var(--ink)}
.track{height:18px;border:3px solid var(--ink);border-radius:10px;background:rgba(255,255,255,.5);overflow:hidden;margin-top:4px}
.track i{display:block;height:100%;width:0;background:var(--green);transition:width .1s}
#banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:clamp(22px,3.6vw,42px);font-weight:800;color:#fff;text-align:center;text-shadow:0 4px 0 var(--ink),0 0 12px rgba(0,0,0,.4);display:none;width:90vw}
#bottom{position:absolute;left:0;right:0;bottom:26px;display:flex;flex-direction:column;align-items:center;gap:10px}
#meterWrap{display:none;flex-direction:column;align-items:center;gap:8px;color:#fff;font-weight:800;text-shadow:0 2px 0 var(--ink)}
#meterLane{font-size:22px}
.meter{position:relative;width:min(560px,74vw);height:30px;border:4px solid var(--ink);border-radius:16px;background:linear-gradient(90deg,#6b7280 0 35%,#3b82f6 35% 65%,#22c55e 65% 90%,#ffc93c 90% 100%);box-shadow:0 4px 0 var(--ink)}
#meterMark{position:absolute;left:0;top:-10px;width:10px;height:44px;margin-left:-5px;background:#fff;border:3px solid var(--ink);border-radius:5px}
#meterInfo{font-size:16px}
#workStatus{display:none;background:var(--gold);border:3px solid var(--ink);border-radius:30px;padding:8px 24px;font-weight:800;font-size:20px;box-shadow:0 4px 0 var(--ink)}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;border:1px solid var(--ink);opacity:.7}
button{font-family:inherit;font-weight:800;font-size:15px;color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:12px;padding:8px 16px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:disabled{background:#ddd;color:#888;border-color:#888;box-shadow:0 4px 0 #888;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,33,61,.55);z-index:10}
.card{background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:28px 30px;width:min(92vw,440px);text-align:center}
.card h1{margin:0 0 4px;font-size:30px;line-height:1.15;color:var(--blue)}
.card p{margin:6px 0 16px;font-size:14px;line-height:1.7;font-weight:500}
#loginBtn{width:100%;background:#fff;font-size:17px;padding:12px;display:flex;align-items:center;justify-content:center;gap:10px}
#playBtn{width:100%;font-size:20px;padding:14px;background:var(--blue);color:#fff}
#menuMsg{min-height:20px;margin-top:10px;color:var(--red);font-weight:800;font-size:13px}
#who{font-size:13px;font-weight:800;margin-bottom:10px}
#signOut{margin-top:12px;font-size:12px;padding:4px 10px;background:#fff}
#danger{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 40px rgba(229,72,77,0)}
#rouletteText{position:absolute;left:50%;top:16%;transform:translateX(-50%);display:none;font-size:clamp(28px,5vw,60px);font-weight:800;color:#fff;text-shadow:0 5px 0 var(--ink),0 0 16px rgba(0,0,0,.5);white-space:nowrap}
#meterLane,#meterInfo{max-width:92vw;text-align:center}
.card p.hint{font-size:12px;color:#445;margin:0 0 12px}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div id="danger"></div>
  <div id="panel">
    <div class="big">💰 <span id="uiMoney">0</span></div>
    <div>🏦 基地バンク：<span id="uiBank">0</span></div>
    <div>💪 キックパワー：<span id="uiPower">10</span>（最大飛距離 <span id="uiDist">0</span>m）</div>
    <div>🏃 スピードLv（逃走中のみ）：<span id="uiSpeed">1</span></div>
    <div>👾 キャラ：<span id="uiPets">0</span>/10 ／ 収入 <span id="uiInc">0</span>/秒</div>
    <div>📖 図鑑：<span id="uiDex">0</span>/20</div>
    <button id="speedBtn">スピード強化 [R]</button>
  </div>
  <div id="escape"><div id="escapeText"></div><div class="track"><i id="escapeFill"></i></div></div>
  <div id="rouletteText"></div>
  <div id="cross"></div>
  <div id="banner"></div>
  <div id="bottom">
    <div id="meterWrap">
      <div id="meterLane"></div>
      <div class="meter" id="meterBar"><i id="meterMark"></i></div>
      <div id="meterInfo"></div>
    </div>
    <div id="workStatus"></div>
  </div>
</div>

<div id="menu">
  <div class="card">
    <h1>LUCKY BLOCK<br>TSUNAMI SURVIVAL</h1>
    <p>ダンベルでパワーを溜め、メーターを合わせて遠くへ蹴ろう。<br>着地したゾーンのレアリティのキャラが出る！ 出たキャラを操作して津波から逃げ切れ！</p>
    <p class="hint">操作：WASD 移動 ／ Space ジャンプ ／ マウス 視点 ／ Q 筋トレ ／ E・クリック キック ／ R スピード強化 ／ C 視点切替（逃走中）</p>
    <div id="who"></div>
    <button id="loginBtn">
      <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Googleでログインして遊ぶ
    </button>
    <div id="playBox" style="display:none">
      <button id="playBtn">クリックして開始</button>
      <p style="margin:10px 0 0;font-size:12px">Escキーでカーソルを解除（一時停止）できます</p>
      <button id="signOut">ログアウト</button>
    </div>
    <div id="menuMsg"></div>
  </div>
</div>

const totalIncome = () => gs.pets.reduce((s, p) => s + p.inc, 0);
const userRef = () => doc(db, 'users', uid);

async function loadData(){
  saveEnabled = false;
  try {
    const snap = await getDoc(userRef());
    if (snap.exists()){
      const d = snap.data();
      gs = { ...defaultState(), ...d };
      gs.money = Math.max(0, +gs.money || 0);
      gs.bank = Math.max(0, +gs.bank || 0);
      gs.kickPower = Math.max(10, +gs.kickPower || 10);
      gs.speedLevel = clamp(Math.floor(+gs.speedLevel || 1), 1, MAX_SPEED_LV);
      gs.pets = (Array.isArray(gs.pets) ? gs.pets : []).filter(p => p && p.inc > 0).slice(0, MAX_PETS).map(p => {
        if (Number.isInteger(p.sp) && SP[p.sp]) return { sp:p.sp, inc:+p.inc };
        const pool = SP.map((s, i) => i).filter(i => SP[i].r === rankFromInc(p.inc));   // 旧データの互換
        return { sp:pool[Math.floor(Math.random() * pool.length)], inc:+p.inc };
      });
      gs.dex = [...new Set([...(Array.isArray(gs.dex) ? gs.dex : []), ...gs.pets.map(p => p.sp)])].filter(i => SP[i]);
      if (gs.lastSeen){
        const sec = Math.min(7200, (Date.now() - gs.lastSeen) / 1000), gain = totalIncome() * sec;
        if (gain >= 1){ gs.bank += gain; offlineMsg = `留守中に基地が ${fmt(gain)}金 稼いだ！`; }
      }
    } else {
      gs = defaultState();
      await setDoc(userRef(), { ...gs, lastSeen:Date.now() });
    }
    saveEnabled = true;
  } catch (e){
    $('menuMsg').textContent = 'セーブデータにアクセスできません（Firestoreを作成し、ルールを確認してください）: ' + (e.code || e.message);
  }
}

/* ブロックが着地 → シルエットがルーレット → 「デン！」で確定 → 逃走開始 */
function landBlock(){
  burst(new THREE.Vector3(K.landX, 3, K.landZ), 0xf7c61b, 45, 16);
  flyBlock.visible = false;
  K.sp = pickSpecies(K.D);
  K.inc = Math.max(1, Math.round(SP[K.sp].base * (1 + K.D / 1500) * rnd(.9, 1.1)));
  const seq = [], times = []; let tsum = 0, dtv = .07, last = -1;
  while (tsum < 3.2){
    let c; do { c = Math.floor(Math.random() * SP.length); } while (c === last);
    last = c; seq.push(c); tsum += dtv; times.push(tsum); dtv *= 1.16;
  }
  roul = { seq, times, t:0, idx:-1, phase:'spin', hold:0 };
  state = 'roulette'; cam.yaw = 0; cam.pitch = .28; cam.mul = .85; cam.goal = null; snapCam();
  showRoulette('ドゥルルルルル…', '#fff');
  showMessage(`${RANKS[zoneOf(K.D)].n}ゾーンに着地！ 中身は…`, 2600, RANKS[zoneOf(K.D)].css);
}
function updateRoulette(dt){
  roul.t += dt;
  if (roul.phase === 'spin'){
    let idx = 0; while (idx < roul.times.length && roul.t >= roul.times[idx]) idx++;
    if (idx >= roul.times.length){
      roul.phase = 'reveal'; roul.hold = 0; showSil(null);
      const g = makePetModel(K.sp); g.scale.setScalar(1.5); g.position.set(K.landX, 0, K.landZ);
      scene.add(g); runner = { g, sp:K.sp, y:0, vy:0, t:0 };
      const R = RANKS[SP[K.sp].r];
      burst(new THREE.Vector3(K.landX, 4, K.landZ), R.c, 45, 16); burst(new THREE.Vector3(K.landX, 4, K.landZ), 0xffffff, 25, 10);
      showRoulette(`デン！ ${SP[K.sp].n}（${R.n}）`, R.css);
      return;
    }
    if (idx !== roul.idx){ roul.idx = idx; showSil(roul.seq[idx]); }
    const g = sils[roul.seq[idx]]; if (g){ g.rotation.z = Math.sin(roul.t * 40) * .05; g.scale.setScalar(1.5 + Math.sin(roul.t * 25) * .05); }
  } else {
    roul.hold += dt;
    if (runner) runner.g.position.y = Math.abs(Math.sin(roul.hold * 9)) * .5;
    if (roul.hold > 1.2) startRun();
  }
}
function startRun(){
  state = 'escape'; roul = null; showRoulette(null);
  wave.front = K.landZ - WAVE_GAP; wave.speed = waveSpeed(K.D); wave.t = 0; placeWave(); wave.group.visible = true;
  cam.goal = Math.PI; cam.pitch = .35; cam.mul = 1.15;          // 三人称（後ろ）視点で走り出す
  $('escape').style.display = 'block';
  showMessage('走れ！！ Wでゴールへ！', 2200, '#ff8787');
}
function removeRunner(){ if (runner){ scene.remove(runner.g); runner = null; } }
function endEscape(){
  state = 'idle'; roul = null; showRoulette(null); showSil(null);
  wave.group.visible = false; $('escape').style.display = 'none'; $('danger').style.boxShadow = 'inset 0 0 160px 40px rgba(229,72,77,0)';
  removeRunner(); cam.yaw = 0; cam.pitch = .45; cam.mul = 1; cam.goal = null; pst.face = Math.PI; snapCam();   // 自分のキャラに戻る
}
function die(){
  const name = SP[K.sp].n;
  burst(runner.g.position.clone().setY(3), 0x60a5fa, 45, 16);
  endEscape();
  showMessage(`${name} は波に飲まれた…`, 3000, '#bfdbfe');
}
function winEscape(){
  const sp = K.sp, inc = K.inc, R = RANKS[SP[sp].r];
  burst(runner.g.position.clone().setY(3), 0x86efac, 40, 14);
  endEscape();
  if (!gs.dex.includes(sp)) gs.dex.push(sp);
  const pet = { sp, inc };
  let msg;
  if (gs.pets.length < MAX_PETS){ gs.pets.push(pet); msg = `生還！ ${SP[sp].n}（${R.n}）を基地に配置！ +${inc}/秒`; }
  else {
    let mi = 0; gs.pets.forEach((p, i) => { if (p.inc < gs.pets[mi].inc) mi = i; });
    if (inc > gs.pets[mi].inc){ gs.pets[mi] = pet; msg = `生還！ 基地が満員なので弱いキャラと入れ替えた（+${inc}/秒）`; }
    else { const bonus = inc * 30; gs.money += bonus; msg = `生還！ 基地が満員なのでボーナス ${fmt(bonus)}金！`; }
  }
  showMessage(msg, 3800, R.css);
  rebuildPets(); saveData();
}

/* 感圧板 */
let plateOn = false, plateCool = 0;
function checkPlate(dt){
  const p = player.position;
  const on = state === 'idle' && Math.abs(p.x - PLATE.x) < PLATE.hw && Math.abs(p.z - PLATE.z) < PLATE.hd && p.y < 2;
  plate.position.y += ((on ? 0 : 0.1) - plate.position.y) * Math.min(1, dt * 15);
  if (on){
    plateCool -= dt;
    if (!plateOn || plateCool <= 0){ collectBank(plateOn); plateCool = 1; }
  }
  plateOn = on;
}
function collectBank(silent){
  const n = Math.floor(gs.bank);
  if (n < 1) return;
  gs.money += n; gs.bank -= n; saveData();
  if (!silent) showMessage(`🏦 ${fmt(n)}金 受け取った！`, 2000, '#fde68a');
}

/* ================= 毎フレーム更新 ================= */
let labelTimer = 0;

/* 自分のキャラ：基地では常に普通の速さ（スピードLvは関係なし） */
function movePlayer(dt){
  let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  let r = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  if (lifting) f = r = 0;
  const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
  let dx = -sy * f + cy * r, dz = -cy * f - sy * r;
  const len = Math.hypot(dx, dz); if (len > 0){ dx /= len; dz /= len; }
  const k = 1 - Math.exp(-14 * dt);
  pst.vel.x += (dx * WALK_SPEED - pst.vel.x) * k; pst.vel.z += (dz * WALK_SPEED - pst.vel.z) * k;
  const pos = player.position;
  pos.x = clamp(pos.x + pst.vel.x * dt, -HALF_X, HALF_X);
  pos.z = clamp(pos.z + pst.vel.z * dt, LANE_START + 1, 86);       // 自分のキャラはレーンに入れない
  if (keys.Space && pst.onGround && !lifting){ pst.vy = 20; pst.onGround = false; }
  pst.vy -= 55 * dt; pos.y += pst.vy * dt;
  if (pos.y <= 0){ pos.y = 0; pst.vy = 0; pst.onGround = true; }
  let target = pst.face;
  if (lifting) target = cam.yaw;
  else if (len > 0) target = Math.atan2(dx, dz);
  else if (inSafe()) target = Math.PI;
  pst.face = lerpAngle(pst.face, target, 1 - Math.exp(-12 * dt));
  player.rotation.y = pst.face;
}

/* 逃げるキャラ：スピードLvが速さに反映される */
function moveRunner(dt){
  const sp = runSpeed(), g = runner.g;
  const fz = (keys.KeyW || keys.ArrowUp) ? 1 : (keys.KeyS || keys.ArrowDown) ? -.35 : 0;
  let r = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  r *= Math.cos(cam.yaw) >= 0 ? 1 : -1;                              // 画面の左右に合わせる
  const vx = r * sp * .8, vz = fz * sp, mv = Math.abs(vx) + Math.abs(vz);
  g.position.x = clamp(g.position.x + vx * dt, -(LANE_W / 2 - 2.5), LANE_W / 2 - 2.5);
  g.position.z = clamp(g.position.z + vz * dt, LANE_START - LANE_LEN + 20, LANE_START + 6);
  if (keys.Space && runner.y <= 0.01) runner.vy = 20;
  runner.vy -= 55 * dt; runner.y += runner.vy * dt; if (runner.y < 0){ runner.y = 0; runner.vy = 0; }
  runner.t += dt * mv * .35;
  g.position.y = runner.y + (mv > 1 ? Math.abs(Math.sin(runner.t)) * .9 : 0);
  g.rotation.y = lerpAngle(g.rotation.y, mv > 1 ? Math.atan2(vx, vz || .001) : 0, 1 - Math.exp(-12 * dt));
  g.rotation.z = Math.sin(runner.t * 2) * .08;
}

function animateChar(dt){
  const u = player.userData, holdBlock = meterOn;
  u.held.visible = holdBlock; u.dumb.visible = lifting;
  if (holdBlock) u.held.rotation.y += dt * 1.2;
  pst.kickAnim = Math.max(0, pst.kickAnim - dt);
  if (lifting){
    pst.rep += dt * 4.5;
    const s = (1 - Math.cos(pst.rep)) / 2;
    u.hips.position.y = 3 - 1.5 * s;
    u.legL.scale.y = u.legR.scale.y = u.hips.position.y / 3;
    u.legL.rotation.x = u.legR.rotation.x = 0;
    u.armL.rotation.x = u.armR.rotation.x = -1.35;
    u.dumb.position.y = 1.9 + .9 * (1 - s);
    gs.kickPower += dt * 3;                                          // 屈伸するほどパワーが上がる
  } else {
    u.hips.position.y = 3; u.legL.scale.y = u.legR.scale.y = 1;
    const spd = Math.hypot(pst.vel.x, pst.vel.z);
    pst.walk += spd * dt * .5;
    const sw = Math.sin(pst.walk) * Math.min(1, spd / 10) * .9;
    u.legL.rotation.x = sw; u.legR.rotation.x = -sw;
    if (holdBlock || state !== 'idle') u.armL.rotation.x = u.armR.rotation.x = -2.9;   // 持つ/応援
    else { u.armL.rotation.x = -sw; u.armR.rotation.x = sw; }
    if (pst.kickAnim > 0) u.legR.rotation.x = -1.4 * (pst.kickAnim / .45);
  }
  shadow.position.set(player.position.x, 0.06, player.position.z);
}

function update(dt){
  if (state === 'flying'){
    K.t = Math.min(1, K.t + dt / K.dur); const p = K.t;
    flyBlock.position.set(K.sx + (K.landX - K.sx) * p, 2 + (1 - p) * 8 + 4 * K.peak * p * (1 - p), K.sz + (K.landZ - K.sz) * p);
    flyBlock.rotation.x += dt * 8; flyBlock.rotation.z += dt * 5;
    if (p >= 1) landBlock();
  } else if (state === 'roulette'){
    updateRoulette(dt);
  } else if (state === 'escape'){
    moveRunner(dt);
    wave.front += wave.speed * dt; wave.t += dt; placeWave();
    wave.body.scale.y = 1 + .05 * Math.sin(wave.t * 5);
    const rz = runner.g.position.z;
    if (wave.front >= rz - 1){ die(); }
    else if (rz > LANE_START){ winEscape(); }
    else {
      const remain = LANE_START - rz, gap = rz - wave.front;
      $('escapeText').textContent = `ゴールまで ${Math.ceil(remain)}m ／ 波まで ${Math.ceil(gap)}m ／ [C]視点切替`;
      $('escapeFill').style.width = clamp((1 - remain / K.D) * 100, 0, 100) + '%';
      $('escapeFill').style.background = gap < 15 ? '#e5484d' : '#2f9e44';
      $('danger').style.boxShadow = `inset 0 0 160px 40px rgba(229,72,77,${(clamp((25 - gap) / 25, 0, 1) * .6).toFixed(2)})`;
    }
  } else {
    movePlayer(dt);
  }
  if (state !== 'idle'){ pst.face = lerpAngle(pst.face, Math.PI, 1 - Math.exp(-8 * dt)); player.rotation.y = pst.face; }
  // キックメーター（セーフゾーンに立つと自動で動く）
  const was = meterOn;
  meterOn = state === 'idle' && !lifting && inSafe();
  if (meterOn){ if (!was) meterT = 0; meterT += dt / 1.4; meterVal = tri(meterT); }
  checkPlate(dt);
  animateChar(dt);
  petMeshes.forEach(g => { g.position.y = .6 + Math.abs(Math.sin(performance.now() * .003 + g.userData.phase)) * .7; });
  for (let i = parts.length - 1; i >= 0; i--){
    const q = parts[i]; q.life -= dt; q.v.y -= 30 * dt; q.m.position.addScaledVector(q.v, dt);
    if (q.m.position.y < .3){ q.m.position.y = .3; q.v.multiplyScalar(.4); }
    if (q.life <= 0){ scene.remove(q.m); parts.splice(i, 1); }
  }
  labelTimer -= dt;
  if (labelTimer <= 0){ labelTimer = .3; bankLabel.userData.set(['🏦 たまった金', fmt(gs.bank) + ' 金'], '#fde68a'); }
}

/* カメラ：逃走は三人称（キャラの後ろ）が基本。カメラは常に波の手前に留まり、波が視界を覆わない */
function updateCamera(dt){
  if (cam.goal !== null){
    cam.yaw = lerpAngle(cam.yaw, cam.goal, 1 - Math.exp(-5 * dt));
    const diff = Math.abs((((cam.goal - cam.yaw + Math.PI) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) - Math.PI);
    if (diff < .02){ cam.yaw = cam.goal; cam.goal = null; }
  }
  camTarget.lerp(targetPos(), 1 - Math.exp(-12 * dt));
  const d = cam.dist * cam.mul, cp = Math.cos(cam.pitch);
  camera.position.set(camTarget.x + Math.sin(cam.yaw) * cp * d, Math.max(1.5, camTarget.y + Math.sin(cam.pitch) * d), camTarget.z + Math.cos(cam.yaw) * cp * d);
  if (state === 'escape' && wave.group.visible) camera.position.z = Math.max(camera.position.z, wave.front + 3);
  camera.lookAt(camTarget);
}

/* ================= HUD ================= */
const setText = (id, v) => { const el = $(id); if (el._v !== v){ el._v = v; el.textContent = v; } };
const setShow = (id, show, disp = 'block') => { const el = $(id); const v = show ? disp : 'none'; if (el.style.display !== v) el.style.display = v; };
let meterKey = '';
function updateUI(){
  setText('uiMoney', fmt(gs.money)); setText('uiBank', fmt(gs.bank));
  setText('uiPower', Math.floor(gs.kickPower)); setText('uiDist', maxKick());
  setText('uiSpeed', gs.speedLevel); setText('uiPets', gs.pets.length); setText('uiInc', fmt(totalIncome()));
  setText('uiDex', gs.dex.length);
  const sb = $('speedBtn'), max = gs.speedLevel >= MAX_SPEED_LV;
  setText('speedBtn', max ? 'スピード最大！' : `スピード強化 [R] — ${fmt(speedCost())}金`);
  sb.disabled = max || gs.money < speedCost();
  setShow('meterWrap', meterOn, 'flex');
  if (meterOn){
    const mk = maxKick(), D = kickDist(meterVal), zone = zoneOf(D);
    if (meterKey !== String(mk)){            // メーターの色＝その位置で出やすいレアリティ
      meterKey = String(mk);
      const stops = [];
      RANKS.forEach((R, i) => {
        const fa = clamp((BANDS[i] - 60) / (mk - 60), 0, 1), fb = clamp((BANDS[i + 1] - 60) / (mk - 60), 0, 1);
        if (fb > fa) stops.push(`${R.css} ${(fa * 100).toFixed(1)}% ${(fb * 100).toFixed(1)}%`);
      });
      $('meterBar').style.background = `linear-gradient(90deg,${stops.join(',')})`;
    }
    $('meterMark').style.left = (meterVal * 100) + '%';
    setText('meterLane', `着地ゾーン：${RANKS[zone].n}（${BANDS[zone]}〜${BANDS[zone + 1]}m）`); $('meterLane').style.color = RANKS[zone].css;
    setText('meterInfo', `パワー ${Math.round(meterVal * 100)}% → 飛距離 ${D}m（最大 ${mk}m）${meterVal >= .9 ? ' ★PERFECT' : ''} ／ 波の速さ ${Math.round(waveSpeed(D))}（推奨スピードLv.${recLv(D)}）`);
  }
  setShow('workStatus', lifting);
  if (lifting) setText('workStatus', `💪 筋トレ中… パワー ${Math.floor(gs.kickPower)}（Qでやめる）`);
}

/* ================= メニュー・ログイン ================= */
function hideMenu(){ $('menu').style.display = 'none'; $('hud').style.display = 'block'; }
function showMenu(){ $('menu').style.display = 'flex'; renderMenu(); }
function renderMenu(){
  $('loginBtn').style.display = uid ? 'none' : 'flex';
  $('playBox').style.display = uid && saveEnabled ? 'block' : 'none';
  $('playBtn').textContent = started ? 'クリックして再開' : 'クリックして開始';
  $('who').textContent = uid ? `${userName} さんでログイン中` : '';
}
$('loginBtn').addEventListener('click', () => {
  $('menuMsg').textContent = '';
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => $('menuMsg').textContent = 'ログインに失敗しました: ' + e.code);
});
$('signOut').addEventListener('click', async () => { await saveData(); await signOut(auth); location.reload(); });
$('playBtn').addEventListener('click', () => {
  if (dragMode){ running = true; started = true; hideMenu(); return; }
  try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e){}
});
$('speedBtn').addEventListener('click', upgradeSpeed);

onAuthStateChanged(auth, async u => {
  if (!u){ uid = null; saveEnabled = false; $('hud').style.display = 'none'; showMenu(); return; }
  uid = u.uid; userName = u.displayName || 'プレイヤー';
  $('menuMsg').textContent = '';
  await loadData();
  lastTick = Date.now();
  rebuildPets(); renderMenu();
  if (offlineMsg){ setTimeout(() => showMessage('🏠 ' + offlineMsg, 4000, '#fde68a'), 800); offlineMsg = ''; }
});

/* ================= ループ ================= */
let lastT = performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (running) update(dt);
  updateCamera(dt);
  updateUI();
  renderer.render(scene, camera);
})(performance.now());
renderMenu();
</script>
